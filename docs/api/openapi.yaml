    HealthResponse:
      type: object
      description: Minimal public health information. It intentionally does not expose database vendor, filesystem paths,
        deployment mode, organization data, license information or application internals.
      properties:
        status:
          $ref: '#/components/schemas/HealthComponentStatus'
          description: Overall health. DOWN when the database is not reachable.
        backend:
          $ref: '#/components/schemas/HealthComponentStatus'
          description: Backend process availability. If this response is returned, this value is UP.
        database:
          $ref: '#/components/schemas/HealthComponentStatus'
          description: Whether the backend can successfully validate database connectivity.
        timestamp:
          type: string
          format: date-time
          description: UTC time at which the health check was evaluated.
      required:
      - status
      - backend
      - database
      - timestamp
      additionalProperties: false
